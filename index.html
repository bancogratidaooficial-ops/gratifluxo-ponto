<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gratifluxo Pontos</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2ff;font-family:Arial}
.top{background:#001a4d;color:#fff;padding:14px;text-align:center}
.controles{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;background:#fff}
.controles button{padding:16px;border:0;border-radius:12px;font-weight:900}
.be{background:#001a4d;color:#fff}.bs{background:#ffcc00;color:#000}
.ba{background:#e9efff;color:#001a4d;border:1px solid #c5d2ff!important}
.tabela{margin:10px;background:#fff;border-radius:12px;border:1px solid #d0d8f0;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#001a4d;color:#fff;padding:8px 4px;font-size:10px}
td{padding:10px 4px;border-bottom:1px solid #eee;text-align:center}
.total{background:#ffcc00!important;font-weight:900}
.foot{padding:10px;display:grid;gap:8px}
.btn{padding:14px;border-radius:12px;border:0;font-weight:900}
</style>
</head>
<body>
<div class="top">
<b>📊 GRATIFLUXO PONTOS</b><br>
<small style="color:#7ab8ff">Planilha Ponto - Dia / Data / Hora</small><br>
<small id="relogio" style="color:#ffcc00"></small>
</div>

<div class="controles">
<button class="be" onclick="bater('entrada')">🟢 ENTRADA</button>
<button class="bs" onclick="bater('saida')">🔴 SAÍDA</button>
<button class="ba" onclick="bater('almoco_ida')">🍽️ ALM. SAÍDA</button>
<button class="ba" onclick="bater('almoco_volta')">↩️ VOLTA</button>
</div>

<div class="tabela">
<table>
<thead><tr><th>DIA</th><th>DATA</th><th>ENTRADA</th><th>ALM.SAÍ</th><th>ALM.VOL</th><th>SAÍDA</th><th>TOTAL</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>

<div class="foot">
<button class="btn" style="background:#25D366;color:#fff" onclick="exportarZap()">📲 ENVIAR NO WHATSAPP</button>
<button class="btn" style="background:#001a4d;color:#fff" onclick="exportarCSV()">📥 BAIXAR EXCEL GRATIFLUXO</button>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<button class="btn" style="background:#001a4d;color:#00ff88;border:1px solid #00ff88" onclick="fazerBackup()">💾 BACKUP</button>
<button class="btn" style="background:#001a4d;color:#ffcc00;border:1px solid #ffcc00" onclick="document.getElementById('f').click()">♻️ RESTAURAR</button>
<input type="file" id="f" style="display:none" accept=".json" onchange="restaurar(this)">
</div>
<button class="btn" style="background:#fff;color:#c00;border:1px solid #fcc" onclick="limpar()">🗑️ Zerar mês</button>
<a href="../index.html" style="text-align:center;color:#001a4d;font-size:12px;text-decoration:none">⬅️ Voltar ao Portal do Povo</a>
</div>

<script>
function bater(tipo){
 const d=new Date();const data=d.toLocaleDateString('pt-BR');const hora=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});const dia=d.toLocaleDateString('pt-BR',{weekday:'short'});
 let dados=JSON.parse(localStorage.getItem('gratifluxo_pontos_v1')||'{}');
 if(!dados[data]) dados[data]={dia,data,entrada:'',almoco_ida:'',almoco_volta:'',saida:''};
 dados[data][tipo==='almoco_ida'?'almoco_ida':tipo==='almoco_volta'?'almoco_volta':tipo]=hora;
 localStorage.setItem('gratifluxo_pontos_v1',JSON.stringify(dados));render();
 alert(tipo.toUpperCase()+' '+hora+' ok!');
}
function calc(r){
 if(!r.entrada) return '--:--';
 const toM=t=>{let[a,b]=t.split(':').map(Number);return a*60+b};
 if(r.entrada&&r.saida){let tot=toM(r.saida)-toM(r.entrada);if(r.almoco_ida&&r.almoco_volta) tot-=toM(r.almoco_volta)-toM(r.almoco_ida);if(tot<0)tot+=1440;return String(Math.floor(tot/60)).padStart(2,'0')+':'+String(tot%60).padStart(2,'0');}
 if(r.entrada&&r.almoco_ida){let tot=toM(r.almoco_ida)-toM(r.entrada);return String(Math.floor(tot/60)).padStart(2,'0')+':'+String(tot%60).padStart(2,'0')+'*';}
 return '--:--';
}
function render(){
 let dados=JSON.parse(localStorage.getItem('gratifluxo_pontos_v1')||'{}');
 let tb=document.getElementById('tbody');
 let lista=Object.values(dados).sort((a,b)=>{let [da,ma,aa]=a.data.split('/');let [db,mb,ab]=b.data.split('/');return new Date(aa,ma-1,da)-new Date(ab,mb-1,db)});
 tb.innerHTML=lista.length?lista.map(r=>`<tr><td><b>${r.dia}</b></td><td>${r.data}</td><td>${r.entrada||'-'}</td><td>${r.almoco_ida||'-'}</td><td>${r.almoco_volta||'-'}</td><td>${r.saida||'-'}</td><td class="total">${calc(r)}</td></tr>`).join(''):'<tr><td colspan=7 style="padding:20px;color:#888">Nenhum ponto ainda</td></tr>';
}
function exportarCSV(){
 let dados=JSON.parse(localStorage.getItem('gratifluxo_pontos_v1')||'{}');let lista=Object.values(dados);if(!lista.length){alert('Sem dados');return}
 let csv='DIA;DATA;ENTRADA;ALMOCO SAIDA;ALMOCO VOLTA;SAIDA;TOTAL\n';lista.forEach(r=>csv+=`${r.dia};${r.data};${r.entrada};${r.almoco_ida};${r.almoco_volta};${r.saida};${calc(r)}\n`);
 let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`gratifluxo-pontos-${new Date().toISOString().slice(0,10)}.csv`;a.click();
}
function exportarZap(){let dados=JSON.parse(localStorage.getItem('gratifluxo_pontos_v1')||'{}');let lista=Object.values(dados);if(!lista.length){alert('Sem dados');return}let txt=`*GRATIFLUXO PONTOS*%0A%0A`;lista.forEach(r=>txt+=`${r.data} ${r.dia} - Ent ${r.entrada} / Alm ${r.almoco_ida}-${r.almoco_volta} / Sai ${r.saida} = ${calc(r)}%0A`);window.open('https://wa.me/?text='+txt,'_blank');}
function fazerBackup(){let d=localStorage.getItem('gratifluxo_pontos_v1');if(!d){alert('Sem dados');return}let b=new Blob([d],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`gratifluxo-pontos-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();}
function restaurar(i){let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{localStorage.setItem('gratifluxo_pontos_v1',e.target.result);render();alert('Restaurado Gratifluxo!')};r.readAsText(f);}
function limpar(){if(confirm('Zerar Gratifluxo? Faça backup!')){localStorage.removeItem('gratifluxo_pontos_v1');render();}}
setInterval(()=>document.getElementById('relogio').textContent=new Date().toLocaleString('pt-BR'),1000);render();
</script>
</body>
</html>
